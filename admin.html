    <label>آدرس سرور (IP)</label>
    <input type="text" id="ipInput" placeholder="مثلاً play.craftopia.net">

    <label>نام سایت</label>
    <input type="text" id="nameInput" placeholder="CrafTopia">

    <label>توضیحات</label>
    <textarea id="descInput" rows="2" placeholder="توضیح کوتاه سایت"></textarea>

    <label>گیم‌مود جدید (نام)</label>
    <input type="text" id="gmName" placeholder="مثلاً Survival">
    <label>توضیحات گیم‌مود</label>
    <input type="text" id="gmDesc" placeholder="مثلاً بقا در دنیای باز">

    <button class="btn" onclick="addGamemode()">➕ اضافه کردن گیم‌مود</button>

    <button class="btn" onclick="saveAll()" style="width:100%;">💾 ذخیره همه</button>

  <script src="config.js"></script>
  <script>
    loadConfig();

    document.getElementById('ipInput').value = CONFIG.serverIP || '';
    document.getElementById('nameInput').value = CONFIG.siteName;
    document.getElementById('descInput').value = CONFIG.description;

    function renderGmList() {
      const list = document.getElementById('gmList');
      if (CONFIG.gamemodes.length === 0) {
        list.innerHTML = 'هنوز گیم‌مودی نیست.
';
        return;
      }
      list.innerHTML = CONFIG.gamemodes.map((m, i) => `

          ${m.name} — ${m.description}
          <button class="del" onclick="removeGm(${i})">✖</button>

      `).join('');
    }
    renderGmList();

    function addGamemode() {const name = document.getElementById('gmName').value.trim();
      const desc = document.getElementById('gmDesc').value.trim();
      if (!name) { alert('نام گیم‌مود رو بنویس!'); return; }
      CONFIG.gamemodes.push({ name, description: desc });
      document.getElementById('gmName').value = '';
      document.getElementById('gmDesc').value = '';
      renderGmList();
    }

    function removeGm(i) {
      CONFIG.gamemodes.splice(i, 1);
      renderGmList();
    }

    function saveAll() {
      CONFIG.serverIP = document.getElementById('ipInput').value.trim();
      CONFIG.siteName = document.getElementById('nameInput').value.trim();
      CONFIG.description = document.getElementById('descInput').value.trim();
      saveConfig();
      alert('✅ ذخیره شد!');
    }
  </script>
</body>
